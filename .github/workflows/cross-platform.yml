name: Cross-platform

on:
  push:
    # All branches, but not tag pushes: release.yml owns tag builds, and an
    # unfiltered push trigger double-built every release tag's commit.
    branches:
      - "**"
  pull_request:

# Supersede old revisions within one branch/event, never across push and PR.
# Main runs remain unique and uncancellable because they provide release gates
# and warm the caches consumed by tag builds.
concurrency:
  group: cross-platform-${{ github.ref == 'refs/heads/main' && github.run_id || format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  select-ci:
    name: Select CI work
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      run-matrix: ${{ steps.select.outputs.run-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select push or PR validation
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/select-ci.mjs

  # Keep the complete frontend suite on every supported OS, but run it
  # independently so native compilation and packaging can start immediately.
  frontend:
    needs: select-ci
    if: needs.select-ci.outputs.run-matrix == 'true'
    name: Frontend ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: matrix.platform == 'ubuntu-22.04'
        with:
          components: rustfmt

      - run: npm ci
      # Static source checks are platform-independent. Native compilation
      # and the complete frontend/automation suites still run on all three.
      - run: npm run lint
        if: matrix.platform == 'ubuntu-22.04'
      - run: npm run lint:anti-slop
        if: matrix.platform == 'ubuntu-22.04'
      - run: npm run typecheck
        if: matrix.platform == 'ubuntu-22.04'
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
        if: matrix.platform == 'ubuntu-22.04'
      - run: npm run test:automation-build
      # Instrument once for coverage floors; retain the same behavioral
      # tests without instrumentation on Windows and macOS.
      - run: npm run test:coverage
        if: matrix.platform == 'ubuntu-22.04'
      - run: npx vitest run --dir src
        if: matrix.platform != 'ubuntu-22.04'

  test-and-build:
    needs: select-ci
    if: needs.select-ci.outputs.run-matrix == 'true'
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # appimage keeps branch CI exercising every Linux bundle the
          # release ships and populates ~/.cache/tauri so main saves the
          # bundler-tools cache tag builds restore (tag-ref saves are
          # unreachable from the next tag).
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundleArgs: --bundles deb,rpm,appimage
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundleArgs: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundleArgs: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target
          shared-key: coda-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Resolve Tauri bundler cache key
        id: bundler-cache
        run: node tools/tauri-bundler-cache-key.mjs

      # Keeps NSIS/WiX warm on main so tag-triggered release builds can
      # restore them; caches saved on one tag are unreachable from the next.
      - name: Cache Tauri bundler tools (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ steps.bundler-cache.outputs.revision }}

      # Same role for AppImage tooling (linuxdeploy): the appimage bundle
      # above populates ~/.cache/tauri, and main-branch saves are the only
      # entries a tag-triggered release can restore.
      - name: Cache Tauri bundler tools (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ steps.bundler-cache.outputs.revision }}

      # First-party apt download cache in a runner-owned staging directory.
      # apt hash-verifies every cached .deb against the live index, so a stale
      # cache degrades to a re-download, never to a wrong package. Bump the
      # coda-v1 suffix when the package list changes.
      #
      # ImageOS/ImageVersion exist only as runner process env vars, not in the
      # workflow env context, so they must be promoted through GITHUB_ENV or
      # the cache key renders with empty segments (observed in v0.7.2).
      - name: Resolve apt cache key
        if: matrix.platform == 'ubuntu-22.04'
        run: echo "APT_CACHE_IMAGE=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_ENV"

      - name: Restore apt package cache
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-archives-${{ env.APT_CACHE_IMAGE }}-coda-v1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Two-layer hang defense. The acquire options fail over dead
          # mirrors cheaply; the wall-clock timeout kills trickle stalls
          # that dribble bytes without ever tripping apt's inactivity
          # timeout (archive.ubuntu.com, 2026-08-18). Three attempts,
          # then the step fails.
          apt_options=(
            -o Acquire::https::Timeout=30
            -o Acquire::http::Timeout=30
            -o Acquire::Retries=3
            -o DPkg::Lock::Timeout=60
          )
          apt_retry() {
            local wall_clock_seconds="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              if sudo env DEBIAN_FRONTEND=noninteractive \
                timeout "$wall_clock_seconds" apt-get "${apt_options[@]}" "$@"; then
                return 0
              fi
              echo "apt $1 attempt $attempt failed or hit the ${wall_clock_seconds}s wall clock" >&2
              if [ "$attempt" = 3 ]; then
                return 1
              fi
              sleep 10
            done
          }
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo rm -f /var/lib/man-db/auto-update
          # Index refresh moves ~25 MB cold; 180 s is >4x a healthy fetch.
          apt_retry 180 update
          # Dependency downloads reach ~56 MB plus dpkg configure time.
          apt_retry 300 install -y \
            -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            patchelf
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"

      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          CODA_LASTFM_API_KEY: ${{ secrets.CODA_LASTFM_API_KEY }}
          CODA_LASTFM_SHARED_SECRET: ${{ secrets.CODA_LASTFM_SHARED_SECRET }}
        with:
          uploadWorkflowArtifacts: true
          args: --config src-tauri/tauri.ci.conf.json --target ${{ matrix.target }} ${{ matrix.bundleArgs }}

  # No job on main otherwise compiles x86_64-apple-darwin, so tag-triggered
  # release Intel builds started cold or from stale-lockfile prefix matches
  # (tag-ref cache saves are unreachable from the next tag). Main-push only:
  # zero cost on branch pushes and pull requests. This cache-only job is
  # deliberately outside the release gate's frontend and native checks.
  warm-intel-rust-cache:
    name: Warm macOS Intel Rust cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-apple-darwin

      # Same shared-key family as release.yml's Intel matrix leg, so the
      # release build's primary cache key matches this main-saved entry.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: intel-rust-cache
        with:
          workspaces: ./src-tauri -> target
          shared-key: coda-x86_64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile release dependencies for the Intel target
        # An exact hit already contains the dependency graph. Workspace
        # outputs are pruned before saving, so rebuilding them buys nothing.
        if: steps.intel-rust-cache.outputs.cache-hit != 'true'
        run: |
          # tauri-build only checks that frontendDist exists, and rust-cache
          # prunes workspace-crate artifacts before saving, so an empty stub
          # is enough to compile and cache the dependency graph without a
          # frontend build.
          mkdir -p dist
          cargo build --release --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin
