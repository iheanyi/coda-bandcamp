name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      checks: read
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}

    steps:
      - name: Validate release trigger
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" && "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Manual releases must run from the main branch." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate release tag ancestry
        if: github.event_name == 'push'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" refs/remotes/origin/main; then
            echo "Release tags must point to commits on main." >&2
            exit 1
          fi

      # Releases do not re-run the test suite; ordinary CI already tested the
      # commit. This gate asserts that instead, before any tag is created, so
      # a SHA without green cross-platform CI can never release.
      - name: Require green cross-platform CI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          required_checks=(ubuntu-22.04 windows-latest macos-latest)

          checks_green() {
            local commit_sha="$1"
            local check_runs
            check_runs="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/check-runs?filter=latest&per_page=100" \
              --jq '[.check_runs[] | {name, status, conclusion}]')"
            for check_name in "${required_checks[@]}"; do
              local state
              state="$(jq -r --arg name "$check_name" \
                'map(select(.name == $name)) | first |
                 if . == null then "missing"
                 elif .status != "completed" then "pending"
                 else .conclusion end' <<<"$check_runs")"
              if [[ "$state" != "success" ]]; then
                echo "Required check '$check_name' is $state for $commit_sha." >&2
                return 1
              fi
            done
          }

          if checks_green "$RELEASE_COMMIT"; then
            echo "Cross-platform CI is green for $RELEASE_COMMIT."
            exit 0
          fi

          # Release tags normally point at a version-bump commit whose own CI
          # run is still in flight. Accept it only when the bump changes
          # nothing but version metadata and its parent commit passed CI.
          if git diff --name-only "${RELEASE_COMMIT}^" "$RELEASE_COMMIT" \
            | grep -qvE '^(package\.json|package-lock\.json|src-tauri/(tauri\.conf\.json|Cargo\.(toml|lock)))$'; then
            echo "Release blocked: $RELEASE_COMMIT has no green cross-platform CI and is not a version-only bump commit." >&2
            exit 1
          fi

          parent_commit="$(git rev-parse "${RELEASE_COMMIT}^")"
          if checks_green "$parent_commit"; then
            echo "Version-bump commit accepted: parent $parent_commit passed cross-platform CI."
            exit 0
          fi

          echo "Release blocked: required checks (${required_checks[*]}) are missing, pending, or failed for $RELEASE_COMMIT and its parent. Wait for the Cross-platform workflow to succeed on main, then retry the release." >&2
          exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable authenticated release push
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Configure release commit identity
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare stable release
        id: prepare
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          node tools/prepare-release.mjs \
            --event "$RELEASE_EVENT" \
            --release-type "$RELEASE_TYPE" \
            --tag "$RELEASE_TAG" \
            --run-id "$RELEASE_RUN_ID" \
            --branch "$RELEASE_BRANCH" \
            --repository-root "$GITHUB_WORKSPACE" \
            --github-output "$GITHUB_OUTPUT"

  prepare-draft:
    name: Prepare draft release
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.commit_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Create or verify owned draft
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          draft_directory="$RUNNER_TEMP/coda-release-draft"
          draft_metadata="$draft_directory/release.json"
          release_notes="$draft_directory/notes.md"
          ownership_marker="<!-- coda-release-run:${RELEASE_RUN_ID} coda-release-commit:${RELEASE_COMMIT} -->"
          mkdir -p "$draft_directory"

          if ! gh release view "$RELEASE_TAG" \
            --json body,databaseId,isDraft,tagName \
            > "$draft_metadata" 2>/dev/null; then
            gh api \
              --method POST \
              "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_COMMIT" \
              --jq .body \
              > "$release_notes"
            printf '\n%s\n' "$ownership_marker" >> "$release_notes"
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --draft \
              --title "Coda $RELEASE_TAG" \
              --notes-file "$release_notes" \
              --target "$RELEASE_COMMIT"
            gh release view "$RELEASE_TAG" \
              --json body,databaseId,isDraft,tagName \
              > "$draft_metadata"
          fi

          node tools/verify-release-draft.mjs \
            "$RELEASE_TAG" \
            "$RELEASE_COMMIT" \
            "$RELEASE_RUN_ID" \
            "$draft_metadata"
          release_id="$(jq -er '.databaseId' "$draft_metadata")"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build-release:
    name: ${{ matrix.name }}
    needs:
      - prepare-release
      - prepare-draft
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS arm64
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.commit_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      # Saves only on main (dispatch-mode releases): a cache saved on a tag
      # ref is unreachable from every other tag, so tag-run saves were dead
      # weight that cost up to two minutes of post-job upload. Main's
      # cross-platform CI and its Intel warm job are the producers.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target
          shared-key: coda-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache Tauri bundler tools (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-bundler-tools-${{ runner.os }}-

      - name: Cache Tauri bundler tools (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-bundler-tools-${{ runner.os }}-

      # Same key as cross-platform.yml so tag-triggered releases restore the
      # cache that main-branch CI keeps warm. apt hash-verifies cached .debs,
      # so staleness degrades to a re-download, never to a wrong package.
      # ImageOS/ImageVersion are runner process env vars only; promote them
      # through GITHUB_ENV or the key renders with empty segments.
      - name: Resolve apt cache key
        if: matrix.platform == 'ubuntu-22.04'
        run: echo "APT_CACHE_IMAGE=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_ENV"

      - name: Restore apt package cache
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-archives-${{ env.APT_CACHE_IMAGE }}-coda-v1

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Two-layer hang defense. The acquire options fail over dead
          # mirrors cheaply; the wall-clock timeout kills trickle stalls
          # that dribble bytes without ever tripping apt's inactivity
          # timeout (archive.ubuntu.com, 2026-08-18). Three attempts,
          # then the step fails.
          apt_options=(
            -o Acquire::https::Timeout=30
            -o Acquire::http::Timeout=30
            -o Acquire::Retries=3
            -o DPkg::Lock::Timeout=60
          )
          apt_retry() {
            local wall_clock_seconds="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              if sudo env DEBIAN_FRONTEND=noninteractive \
                timeout "$wall_clock_seconds" apt-get "${apt_options[@]}" "$@"; then
                return 0
              fi
              echo "apt $1 attempt $attempt failed or hit the ${wall_clock_seconds}s wall clock" >&2
              if [ "$attempt" = 3 ]; then
                return 1
              fi
              sleep 10
            done
          }
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          sudo rm -f /var/lib/man-db/auto-update
          # Index refresh moves ~25 MB cold; 180 s is >4x a healthy fetch.
          apt_retry 180 update
          # Dependency downloads reach ~56 MB plus dpkg configure time.
          apt_retry 300 install -y \
            -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            patchelf
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"

      - run: npm ci

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODA_LASTFM_API_KEY: ${{ secrets.CODA_LASTFM_API_KEY }}
          CODA_LASTFM_SHARED_SECRET: ${{ secrets.CODA_LASTFM_SHARED_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          releaseId: ${{ needs.prepare-draft.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseName: Coda ${{ needs.prepare-release.outputs.tag }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          # The release overlay skips the typecheck inside beforeBuildCommand;
          # the green-CI gate proved cross-platform CI (whose npm run build
          # typechecks every push) already covered this commit.
          args: --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }}

  publish-release:
    name: Verify and publish
    needs:
      - prepare-release
      - prepare-draft
      - build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.prepare-release.outputs.commit_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify release is still current
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: >-
          node tools/prepare-release.mjs
          --event push
          --release-type patch
          --tag "$RELEASE_TAG"
          --run-id "$RELEASE_RUN_ID"
          --branch main
          --repository-root "$GITHUB_WORKSPACE"

      - name: Download release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/coda-release"
          gh release view "$RELEASE_TAG" \
            --json assets,body,isDraft,tagName \
            > "$RUNNER_TEMP/coda-release/release.json"

      - name: Verify draft ownership
        env:
          RELEASE_COMMIT: ${{ needs.prepare-release.outputs.commit_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: >-
          node tools/verify-release-draft.mjs
          "$RELEASE_TAG"
          "$RELEASE_COMMIT"
          "$RELEASE_RUN_ID"
          "$RUNNER_TEMP/coda-release/release.json"

      - name: Download signed updater assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          SIGNED_ASSET_DIR: ${{ runner.temp }}/coda-release/signed-assets
        run: |
          mkdir -p "$SIGNED_ASSET_DIR"
          gh release download "$RELEASE_TAG" \
            --pattern '*.sig' \
            --pattern '*.app.tar.gz' \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.rpm' \
            --pattern '*.exe' \
            --pattern '*.msi' \
            --dir "$SIGNED_ASSET_DIR"

      - name: Assemble updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          SIGNED_ASSET_DIR: ${{ runner.temp }}/coda-release/signed-assets
          UPDATER_MANIFEST_PATH: ${{ runner.temp }}/coda-release/latest.json
        run: |
          node tools/assemble-updater-manifest.mjs \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/coda-release/release.json" \
            "$SIGNED_ASSET_DIR" \
            "$UPDATER_MANIFEST_PATH"
          gh release upload "$RELEASE_TAG" "$UPDATER_MANIFEST_PATH" --clobber

      # Distinct suffix from the build-dependency cache: different package
      # set and a different runner image (ubuntu-24.04). Tag runs can only
      # restore caches saved on a shared ref, so this mostly serves
      # dispatch-mode releases and re-runs; the baked-index fast path below
      # is what removes the apt cost on fresh tags.
      - name: Resolve apt cache key
        run: echo "APT_CACHE_IMAGE=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_ENV"

      - name: Restore apt package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives
          key: apt-archives-${{ env.APT_CACHE_IMAGE }}-minisign-v1

      - name: Cryptographically verify updater signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          SIGNED_ASSET_DIR: ${{ runner.temp }}/coda-release/signed-assets
          UPDATER_PUBLIC_KEY_PATH: ${{ runner.temp }}/coda-release/updater.pub
        run: |
          set -euo pipefail

          # Two-layer hang defense for the v0.7.1-style publish hang. The
          # acquire options fail over dead mirrors cheaply; the wall-clock
          # timeout kills trickle stalls that dribble bytes without ever
          # tripping apt's inactivity timeout (archive.ubuntu.com,
          # 2026-08-18). Three attempts, then the step fails.
          apt_options=(
            -o Acquire::https::Timeout=30
            -o Acquire::http::Timeout=30
            -o Acquire::Retries=3
            -o DPkg::Lock::Timeout=60
          )
          apt_retry() {
            local wall_clock_seconds="$1"
            shift
            local attempt
            for attempt in 1 2 3; do
              if sudo env DEBIAN_FRONTEND=noninteractive \
                timeout "$wall_clock_seconds" apt-get "${apt_options[@]}" "$@"; then
                return 0
              fi
              echo "apt $1 attempt $attempt failed or hit the ${wall_clock_seconds}s wall clock" >&2
              if [ "$attempt" = 3 ]; then
                return 1
              fi
              sleep 10
            done
          }
          echo "phase: apt install minisign"
          mkdir -p "$RUNNER_TEMP/apt-archives/partial"
          install_args=(
            install --yes --no-install-recommends
            -o Dir::Cache::archives="$RUNNER_TEMP/apt-archives"
            -o APT::Keep-Downloaded-Packages=true
            minisign
          )
          # Fast path: the runner image ships baked apt indexes, so minisign
          # usually installs without the ~25 MB index refresh that consumed
          # 39 s of the v0.7.2 publish job. Any failure (stale baked index,
          # wedged mirror) falls back to exactly the previous sequence.
          if ! sudo env DEBIAN_FRONTEND=noninteractive \
            timeout 120 apt-get "${apt_options[@]}" "${install_args[@]}"; then
            echo "baked-index install failed; refreshing apt indexes" >&2
            # Index refresh moves ~25 MB cold; 180 s is >4x a healthy fetch.
            apt_retry 180 update
            # minisign is a ~100 KB package; 120 s covers dpkg overhead.
            apt_retry 120 "${install_args[@]}"
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/apt-archives"

          echo "phase: write updater public key"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const config = JSON.parse(
            readFileSync("src-tauri/tauri.conf.json", "utf8"),
          );
          writeFileSync(
            process.env.UPDATER_PUBLIC_KEY_PATH,
            Buffer.from(config.plugins.updater.pubkey, "base64"),
          );
          NODE

          echo "phase: verify updater signatures"
          verified_count=0
          for encoded_signature in "$SIGNED_ASSET_DIR"/*.sig; do
            artifact="${encoded_signature%.sig}"
            decoded_signature="$encoded_signature.minisig"
            if [[ ! -f "$artifact" ]]; then
              echo "Missing updater artifact for $encoded_signature" >&2
              exit 1
            fi

            base64 --decode "$encoded_signature" > "$decoded_signature"
            minisign -Vm "$artifact" -x "$decoded_signature" -p "$UPDATER_PUBLIC_KEY_PATH"
            verified_count=$((verified_count + 1))
          done

          if (( verified_count < 4 )); then
            echo "Expected at least four signed updater artifacts, verified $verified_count" >&2
            exit 1
          fi

          echo "Cryptographically verified $verified_count updater artifacts."

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
