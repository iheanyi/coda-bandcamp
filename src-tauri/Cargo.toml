[package]
name = "coda"
version = "0.1.0"
description = "A focused Bandcamp desktop player with a real queue."
authors = ["Coda Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "coda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
governor = { version = "0.10", default-features = false, features = ["jitter", "std"] }
httpdate = "1"
md5 = "0.7"
rand = "0.8"
redb = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSAccessibilityProtocols",
  "NSColor",
  "NSControl",
  "NSFont",
  "NSFontDescriptor",
  "NSKeyValueBinding",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSParagraphStyle",
  "NSResponder",
  "NSScreen",
  "NSText",
  "NSTextField",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSObject",
  "NSString",
  "NSUserDefaults",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
