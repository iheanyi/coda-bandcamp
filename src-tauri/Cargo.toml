[package]
name = "coda"
version = "0.9.0"
description = "A focused Bandcamp desktop player with a real queue."
authors = ["Coda Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "coda_lib"
# Desktop binaries link the Rust library; mobile-only shared/static outputs
# add optimization and linking work without being included in our installers.
crate-type = ["rlib"]

[build-dependencies]
dotenvy = "0.15.7"
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = "0.3"
governor = { version = "0.10", default-features = false, features = ["jitter", "std"] }
httpdate = "1"
md5 = "0.7"
percent-encoding = "2"
quick-xml = "0.41"
rand = "0.8"
redb = "4.1"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Media",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSAccessibilityProtocols",
  "NSColor",
  "NSControl",
  "NSFont",
  "NSFontDescriptor",
  "NSKeyValueBinding",
  "NSLayoutAnchor",
  "NSLayoutConstraint",
  "NSParagraphStyle",
  "NSResponder",
  "NSScreen",
  "NSText",
  "NSTextField",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSObject",
  "NSString",
  "NSUserDefaults",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2.4"

[dev-dependencies]
rcgen = { version = "0.14.7", default-features = false, features = ["ring"] }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }

[profile.release]
panic = "abort"
# Parallelize LLVM work while retaining thin LTO and size optimization.
# Measurements and tradeoffs: docs/build-profile-benchmark-2026-09-05.md.
codegen-units = 8
lto = "thin"
opt-level = "s"
strip = true
